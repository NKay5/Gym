<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de fonte</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet de fonte">
<meta name="theme-color" content="#F4F5F7">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#F4F5F7; --iron-2:#FFFFFF; --iron-3:#ECEEF1; --line:#DDE2E7;
  --chalk:#171B20; --dim:#5B6672; --dim-2:#7C8794;
  --gold:#B8720E; --gold-soft:rgba(184,114,14,.10);
  --steel:#146F87; --steel-soft:rgba(20,111,135,.10);
  --pad:15px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--iron);color:var(--chalk);height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Barlow',ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;position:fixed;inset:0}
#scrollarea{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
h1,h2,h3,.cond,.eyebrow,.tab,.chip,.badge,.btn,.stepper input,.ex-name,.add,.stat .n,.line .n{
  font-family:'Barlow Condensed','Barlow',ui-sans-serif,system-ui,sans-serif}
h1{font-size:25px;font-weight:700;margin:0}
h2{font-size:19px;font-weight:600;margin:0}
button{font-size:15px;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--chalk);background:var(--iron);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2)}
.wrap{padding:0 var(--pad) calc(90px + var(--safe-b));max-width:620px;margin:0 auto}
.muted{color:var(--dim);font-size:13.5px}
.tiny{font-size:12px;color:var(--dim-2)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--iron) 74%,rgba(19,23,28,0));
  padding:14px var(--pad) 11px;max-width:620px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header .sub{font-size:12.5px;color:var(--dim)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);flex:none}

/* ── pictogrammes ─────────────────────────── */
.pic{display:block;fill:none;stroke:#4C5762;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pic .load{stroke:var(--gold)}
.pic .plate{fill:var(--gold);stroke:none}
.pic .ground{stroke:var(--dim-2);opacity:.4;stroke-width:1.8}
.pic .gear{stroke:var(--dim-2)}
.tile{width:52px;height:52px;flex:none;border-radius:11px;background:var(--iron);border:1px solid var(--line);
  display:grid;place-items:center}
.tile.lg{width:110px;height:110px;border-radius:16px}

/* ── cartes ───────────────────────────────── */
.card{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.ex-row{display:flex;align-items:center;gap:12px;background:var(--iron-2);border:1px solid var(--line);
  border-radius:12px;padding:10px;margin-bottom:9px}
.ex-name{font-size:18px;font-weight:600;line-height:1.15}
.add{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:var(--iron);color:var(--gold);font-size:24px;font-weight:600;display:grid;place-items:center;line-height:1}
.add:active{background:var(--gold);color:#17120A}
.add.on{background:var(--gold-soft);border-color:var(--gold)}

.badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;background:var(--iron-3);color:var(--dim)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.steel{background:var(--steel-soft);color:var(--steel)}

.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:11px;font-weight:600;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase;background:var(--iron-3);border:1px solid var(--line)}
.btn.primary{background:var(--gold);color:#FFFBF3;border-color:var(--gold)}
.btn.ghost{background:none}
.btn.sm{padding:9px;font-size:14px}
.btn.danger{color:#E8796B;border-color:#4A2E2B;background:none}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;
  color:var(--dim);white-space:nowrap;font-weight:500}
.chip.on{background:var(--chalk);color:var(--iron);border-color:var(--chalk)}

.setlist{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 2px}
.set-chip{font-size:13.5px;font-weight:600;padding:6px 8px 6px 11px;border-radius:8px;
  background:var(--iron);border:1px solid var(--line);display:flex;align-items:center;gap:7px;color:var(--chalk)}
.set-chip .x{color:var(--dim-2);font-size:17px;line-height:1;font-weight:400;padding:0 2px}
.btn.line-add{display:block;width:100%;text-align:center;padding:10px;border-radius:9px;font-weight:600;font-size:13.5px;
  letter-spacing:.02em;background:var(--gold-soft);color:var(--gold);border:1px dashed var(--gold);margin-top:11px}
.btn.line-add:active{background:var(--gold);color:#FFFBF3}

/* ── steppers de saisie ───────────────────── */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.field .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim-2);
  text-align:center;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--iron)}
.stepper button{width:29px;flex:none;font-size:19px;font-weight:600;color:var(--dim);background:var(--iron-3)}
.stepper button:active{background:var(--line);color:var(--chalk)}
.stepper input{flex:1;min-width:0;border:none;border-radius:0;background:none;text-align:center;
  font-size:21px;font-weight:700;padding:8px 0;color:var(--gold)}
.stepper.steel input{color:var(--steel)}
.stepper input:focus{outline:none;background:rgba(255,255,255,.05)}

/* ── historique ───────────────────────────── */
.acc{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:11px;padding:13px;width:100%;text-align:left}
.acc-head .caret{color:var(--dim-2);font-size:17px;transition:transform .2s;flex:none;display:inline-block}
.acc.open .caret{transform:rotate(90deg)}
.acc-body{padding:0 13px 13px}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.line .n{font-size:17px;font-weight:700;color:var(--gold);white-space:nowrap}

.stat{background:var(--iron-2);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}
.stat .n{font-size:25px;font-weight:700;line-height:1.05}
.stat .l{font-size:10.5px;color:var(--dim-2);letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.chart{width:100%;height:auto;display:block}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  transform:translateZ(0);will-change:transform;
  border-top:1px solid var(--line);padding:8px 0 calc(8px + var(--safe-b));display:flex;justify-content:space-around;
  max-width:620px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim-2);font-size:11px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px}
.tab.on{color:var(--gold)}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.scrim{position:fixed;inset:0;background:rgba(8,10,13,.74);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:620px;margin:0 auto;background:var(--iron-2);
  border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;max-height:88vh;display:flex;
  flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet-head{padding:15px 16px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex:none}
.sheet-body{overflow-y:auto;padding:14px 16px calc(22px + var(--safe-b));-webkit-overflow-scrolling:touch}
ul.tech{margin:0;padding-left:17px;font-size:14px;color:#C7D2DC}
ul.tech li{margin-bottom:6px}

.empty{text-align:center;padding:36px 18px;color:var(--dim)}
.empty .big{font-family:'Barlow Condensed';font-size:21px;font-weight:600;color:var(--chalk);margin-bottom:6px}
.banner{background:#3A2A16;border:1px solid #6B4E22;color:#F0D8AE;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(18px);bottom:calc(86px + var(--safe-b));
  background:var(--chalk);color:var(--iron);font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;
  z-index:60;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="scrollarea">
<header>
  <div><h1 id="hTitle">Exercices</h1><div class="sub" id="hSub"></div></div>
  <button class="icon-btn" data-action="reglages" aria-label="Réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="app" class="wrap"></main>
</div>

<nav>
  <button class="tab" data-tab="exos"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Exercices</button>
  <button class="tab" data-tab="jour"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M12 7.5v9M7.5 12h9"/></svg>Séance</button>
  <button class="tab" data-tab="histo"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Historique</button>
  <button class="tab" data-tab="charges"><svg viewBox="0 0 24 24"><path d="M3 17l5.5-6 4 4L21 6"/><path d="M21 6h-5M21 6v5"/></svg>Charges</button>
</nav>

<div class="scrim" id="scrim" data-action="fermer"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button data-action="fermer" style="font-size:14px;color:var(--dim)">Fermer</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   RELAIS DE STOCKAGE — utilise window.storage s'il existe
   (artefact Claude), sinon bascule sur localStorage pour que
   l'app fonctionne exactement pareil une fois hébergée seule.
   ═══════════════════════════════════════════════════════════ */
if(!window.storage){
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      return v===null ? null : {key, value:v, shared:false};
    },
    set: async (key, value) => { localStorage.setItem(key, value); return {key, value, shared:false}; },
    delete: async (key) => { localStorage.removeItem(key); return {key, deleted:true, shared:false}; },
    list: async (prefix) => {
      const keys = [];
      for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(!prefix || k.indexOf(prefix)===0) keys.push(k); }
      return {keys};
    }
  };
}

/* ═══════════════════════════════════════════════════════════
   CROQUIS — dessinés au trait, viewBox 64×64
   ═══════════════════════════════════════════════════════════ */
function barre(cx,y,hw){
  return '<path class="load" d="M'+(cx-hw)+' '+y+' H'+(cx+hw)+'"/>'+
    '<circle class="plate" cx="'+(cx-hw+5)+'" cy="'+y+'" r="5.4"/>'+
    '<circle class="plate" cx="'+(cx+hw-5)+'" cy="'+y+'" r="5.4"/>';
}
function haltH(cx,cy){
  return '<path class="load" d="M'+(cx-5.5)+' '+cy+' H'+(cx+5.5)+
    'M'+(cx-7.5)+' '+(cy-4.6)+' V'+(cy+4.6)+'M'+(cx+7.5)+' '+(cy-4.6)+' V'+(cy+4.6)+'"/>';
}
function haltV(cx,cy){
  return '<path class="load" d="M'+cx+' '+(cy-5.5)+' V'+(cy+5.5)+
    'M'+(cx-4.6)+' '+(cy-7.5)+' H'+(cx+4.6)+'M'+(cx-4.6)+' '+(cy+7.5)+' H'+(cx+4.6)+'"/>';
}
function kb(cx,cy,r){
  const hw = r*0.62, top = cy-r-hw*1.3;
  return '<path class="load" d="M'+(cx-hw)+' '+(cy-r+1)+
    ' Q'+(cx-hw)+' '+top+' '+cx+' '+top+
    ' Q'+(cx+hw)+' '+top+' '+(cx+hw)+' '+(cy-r+1)+'"/>'+
    '<circle class="plate" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';
}
const SOL = '<path class="ground" d="M7 58 H57"/>';

const PIC = {
deadlift: SOL+'<circle cx="27" cy="14" r="4.6"/><path d="M27.5 19 L37 29"/><path d="M28.5 21 L26 43"/>'+
  '<path d="M37 29 L40 43 L35 57"/>'+barre(29,45,19),

squat: SOL+'<circle cx="31" cy="13" r="4.6"/><path d="M31 18 L33 33"/>'+barre(32,22,19)+
  '<path d="M27 22 L29.5 28"/><path d="M37 22 L34.5 28"/><path d="M33 33 L46 38 L39 57"/>',

frontsquat: SOL+'<circle cx="28" cy="13" r="4.6"/><path d="M28 18 L31 33"/>'+barre(36,24,18)+
  '<path d="M29 20 L38 23"/><path d="M31 33 L44 38 L37 57"/>',

rdl: SOL+'<circle cx="25" cy="16" r="4.6"/><path d="M25.5 21 L37 28"/><path d="M26.5 23 L24 37"/>'+
  '<path d="M37 28 L39 44 L37 57"/>'+barre(27,39,18),

fente: SOL+'<circle cx="31" cy="12" r="4.6"/><path d="M31 17 L31 32"/>'+
  '<path d="M31 32 L43 41 L43 56"/><path d="M31 32 L21 44 L15 55"/>'+
  '<path d="M29 20 L25 32"/><path d="M33 20 L38 32"/>'+haltH(24,35)+haltH(39,35),

hipthrust: SOL+'<path class="gear" d="M9 41 H23 M11 41 V56 M21 41 V56"/>'+
  '<circle cx="16" cy="34" r="4.6"/><path d="M21 37 L41 33"/>'+barre(42,29,13)+
  '<path d="M41 33 L51 40 L50 57"/>',

military: SOL+barre(32,9,19)+'<circle cx="32" cy="21" r="4.6"/><path d="M32 26 L32 41"/>'+
  '<path d="M29 25 L27 11"/><path d="M35 25 L37 11"/><path d="M32 41 L27 57"/><path d="M32 41 L37 57"/>',

pushpress: SOL+barre(32,9,19)+'<circle cx="32" cy="21" r="4.6"/><path d="M32 26 L32 40"/>'+
  '<path d="M29 25 L27 11"/><path d="M35 25 L37 11"/>'+
  '<path d="M32 40 L26 47 L28 57"/><path d="M32 40 L38 47 L36 57"/>',

bench: '<path class="gear" d="M13 42 H49 M19 42 V56 M43 42 V56"/>'+
  '<circle cx="18" cy="35" r="4.6"/><path d="M23 38 H40"/><path d="M40 38 L48 47"/>'+
  '<path d="M28 37 L28 27"/><path d="M35 37 L35 27"/>'+barre(31,24,17),

dips: '<path class="load" d="M7 28 H23 M41 28 H57"/><circle cx="32" cy="15" r="4.6"/><path d="M32 20 L32 37"/>'+
  '<path d="M30 23 L25 32 L21 28"/><path d="M34 23 L39 32 L43 28"/>'+
  '<path d="M32 37 L37 45 L30 52"/>',

landmine: SOL+'<path class="load" d="M8 56 L44 23"/><circle class="plate" cx="47" cy="20" r="4.6"/>'+
  '<circle cx="23" cy="25" r="4.6"/><path d="M23 30 L24 44"/><path d="M25 32 L40 25"/>'+
  '<path d="M24 44 L19 57"/><path d="M24 44 L29 57"/>',

elevations: SOL+'<circle cx="32" cy="14" r="4.6"/><path d="M32 19 L32 40"/>'+
  '<path d="M30 22 H19"/><path d="M34 22 H45"/>'+haltH(14,22)+haltH(50,22)+
  '<path d="M32 40 L27 57"/><path d="M32 40 L37 57"/>',

traction: '<path class="load" d="M7 8 H57"/><path d="M26 9 L30 20"/><path d="M38 9 L34 20"/>'+
  '<circle cx="32" cy="23" r="4.6"/><path d="M32 28 L32 43"/>'+
  '<path d="M32 43 L27 55"/><path d="M32 43 L37 51 L34 57"/>',

rowing: SOL+'<circle cx="22" cy="16" r="4.6"/><path d="M22.5 21 L39 28"/><path d="M24 23 L26 34"/>'+
  barre(28,37,17)+'<path d="M39 28 L42 44 L38 57"/>',

rowuni: '<path class="gear" d="M38 41 H57 M42 41 V55 M53 41 V55"/>'+
  '<circle cx="17" cy="20" r="4.6"/><path d="M18 25 L38 32"/><path d="M27 27 L44 39"/>'+
  '<path d="M21 27 L19 34"/>'+haltH(18,38)+'<path d="M38 32 L40 47 L36 57"/>',

farmer: SOL+'<circle cx="32" cy="12" r="4.6"/><path d="M32 17 L32 38"/>'+
  '<path d="M30 19 L26 33"/><path d="M34 19 L38 33"/>'+haltH(25,37)+haltH(39,37)+
  '<path d="M32 38 L26 56"/><path d="M32 38 L38 50 L41 57"/>',

suitcase: SOL+'<circle cx="31" cy="12" r="4.6"/><path d="M31 17 L33 38"/>'+
  '<path d="M29 19 L27 34"/><path d="M34 19 L39 33"/>'+haltH(40,37)+
  '<path d="M33 38 L28 56"/><path d="M33 38 L39 50 L42 57"/>',

goblet: SOL+'<circle cx="32" cy="12" r="4.6"/><path d="M32 17 L32 38"/>'+
  '<path d="M29 20 L28 27"/><path d="M35 20 L36 27"/>'+haltV(32,29)+
  '<path d="M32 38 L26 56"/><path d="M32 38 L38 50 L41 57"/>',

frontrack: SOL+'<circle cx="32" cy="13" r="4.6"/><path d="M32 18 L32 38"/>'+
  '<path d="M29 22 L26 18"/><path d="M35 22 L38 18"/>'+haltV(24,16)+haltV(40,16)+
  '<path d="M32 38 L26 56"/><path d="M32 38 L38 50 L41 57"/>',

overhead: SOL+'<circle cx="29" cy="22" r="4.6"/><path d="M29 27 L29 41"/>'+
  '<path d="M32 26 L36 12"/>'+haltH(37,9)+'<path d="M26 26 L23 39"/>'+
  '<path d="M29 41 L24 57"/><path d="M29 41 L35 50 L38 57"/>',

kbswing: SOL+'<circle cx="25" cy="16" r="4.6"/><path d="M25.5 21 L37 28"/>'+
  '<path d="M26.5 23 L25 39"/>'+kb(26,46,7)+
  '<path d="M37 28 L39 44 L37 57"/>',

kbclean: SOL+'<circle cx="32" cy="12" r="4.6"/><path d="M32 17 L33 34"/>'+

/* ═══════════════════════════════════════════════════════════
   ÉTAT
   ═══════════════════════════════════════════════════════════ */
const KEY = 'carnet-fonte-v2';
let S = {jours:{}, perso:[]};
let UI = {vue:'exos', date:null, ouvert:{}, exCharge:null, stock:true, filtre:'tous', _y:0, saisie:{}};

const MATLABEL = {haltere:'Haltère', disque:'Disque', kettlebell:'Kettlebell'};
const tous = () => EXOS.concat(S.perso);
const exo = id => tous().find(e=>e.id===id);

/* Migration silencieuse : une séance enregistrée avant l'introduction des
   charges multiples avait {exId,series,reps,charge} à plat. On l'enveloppe
   dans un tableau lignes:[...] pour que l'historique déjà écrit ne bouge pas. */
function migrer(){
  Object.keys(S.jours).forEach(function(d){
    S.jours[d] = (S.jours[d]||[]).map(function(x){
      if(x && x.lignes) return x;
      return {exId:x.exId, lignes:[{series:+x.series||3, reps:+x.reps||0, charge:+x.charge||0, materiel:x.materiel||null}]};
    });
  });
}

async function charger(){
  if(!window.storage){ UI.stock=false; return; }
  try{ const r = await window.storage.get(KEY); if(r && r.value) S = Object.assign(S, JSON.parse(r.value)); }
  catch(e){}
  migrer();
}
let tSave=null;
function sauver(){
  if(!window.storage){ UI.stock=false; return; }
  clearTimeout(tSave);
  tSave = setTimeout(async()=>{
    try{ await window.storage.set(KEY, JSON.stringify(S)); }
    catch(e){ UI.stock=false; toast('Sauvegarde impossible'); }
  }, 400);
}

const f = n => (Math.round((+n||0)*100)/100).toString().replace('.',',');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function longue(s){ const d=new Date(s+'T12:00:00'); return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]; }
function courte(s){ const d=new Date(s+'T12:00:00'); return d.getDate()+' '+MOIS[d.getMonth()].slice(0,4)+'.'; }
function ilYA(s){
  const j = Math.round((new Date(iso(new Date())+'T12:00:00')-new Date(s+'T12:00:00'))/864e5);
  if(j===0) return "aujourd'hui"; if(j===1) return 'hier'; if(j<7) return 'il y a '+j+' jours';
  if(j<14) return 'il y a 1 semaine'; if(j<60) return 'il y a '+Math.round(j/7)+' semaines';
  return 'il y a '+Math.round(j/30)+' mois';
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function buzz(m){ if(navigator.vibrate) try{navigator.vibrate(m)}catch(e){} }

const datesTriees = () => Object.keys(S.jours).filter(d=>S.jours[d] && S.jours[d].length).sort().reverse();
function ligneJour(date){ if(!S.jours[date]) S.jours[date]=[]; return S.jours[date]; }
function derniere(exId, avant){
  const ds = datesTriees().filter(d=>!avant || d<avant);
  for(let i=0;i<ds.length;i++){
    const entry = S.jours[ds[i]].find(x=>x.exId===exId);
    if(entry && entry.lignes && entry.lignes.length) return {date:ds[i], entry:entry, ligne:entry.lignes[entry.lignes.length-1]};
  }
  return null;
}
function cumul(entry){
  const series = entry.lignes.reduce((a,b)=>a+(+b.series||0),0);
  const maxCharge = Math.max.apply(null, entry.lignes.map(li=>+li.charge||0));
  return {series:series, maxCharge:maxCharge};
}
function cumulJour(entries){
  let series=0, maxCharge=0;
  entries.forEach(function(entry){
    if(!entry.lignes || !entry.lignes.length) return;
    const c = cumul(entry); series += c.series; if(c.maxCharge>maxCharge) maxCharge = c.maxCharge;
  });
  return {series:series, maxCharge:maxCharge};
}
function histo(exId){
  return datesTriees().slice().reverse().map(function(d){
    const entry = S.jours[d].find(x=>x.exId===exId);
    if(!entry || !entry.lignes || !entry.lignes.length) return null;
    const top = entry.lignes.reduce((a,b)=> (+b.charge>+a.charge ? b : a));
    return {date:d, charge:+top.charge||0, reps:+top.reps||0, series:cumul(entry).series, lignes:entry.lignes};
  }).filter(Boolean);
}

const app = document.getElementById('app');

function render(){
  const tabs = document.querySelectorAll('.tab');
  for(let i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].dataset.tab===UI.vue);
  const T = {exos:'Exercices', jour:'Séance', histo:'Historique', charges:'Charges'};
  document.getElementById('hTitle').textContent = T[UI.vue];
  const nbJ = datesTriees().length;
  document.getElementById('hSub').textContent =
    UI.vue==='exos'  ? tous().length+' mouvements'
  : UI.vue==='jour'  ? longue(UI.date)
  : UI.vue==='histo' ? nbJ+' séance'+(nbJ>1?'s':'')
  : 'Charge maximale par séance';

  let h = UI.stock ? '' : '<div class="banner">Stockage indisponible : les saisies de cette session ne seront pas conservées.</div>';
  h += UI.vue==='exos' ? vExos() : UI.vue==='jour' ? vJour() : UI.vue==='histo' ? vHisto() : vCharges();
  const y = UI._y; UI._y = 0;
  app.innerHTML = h;
  document.getElementById('scrollarea').scrollTop = y;
}

/* ─── 1. EXERCICES ─── */

  Object.keys(GROUPES).forEach(function(g){
    h += '<button class="chip '+(UI.filtre===g?'on':'')+'" data-action="filtre" data-id="'+g+'">'+
      GROUPES[g].nom.replace('Haut du corps · ','')+'</button>';
  });
  h += '</div>';

  const dej = ligneJour(UI.date).map(x=>x.exId);
  Object.keys(GROUPES).forEach(function(g){
    if(UI.filtre!=='tous' && UI.filtre!==g) return;
    const liste = tous().filter(e=>e.g===g);
    if(!liste.length) return;
    h += '<div style="margin:16px 0 8px"><div class="eyebrow">'+GROUPES[g].nom+'</div><div class="tiny">'+GROUPES[g].sous+'</div></div>';
    liste.forEach(function(e){
      const d = derniere(e.id);
      h += '<div class="ex-row">'+
        '<button class="tile" data-action="fiche" data-id="'+e.id+'">'+pic(e.pic,40)+'</button>'+

function courbe(H){
  let pts = H.map(x=>({d:x.date, y:x.charge, r:x.reps}));
  if(pts.length===1) pts = [pts[0], pts[0]];
  const W=320, Ht=150, pl=32, pr=12, pt=18, pb=24;
  const ys = pts.map(p=>p.y);
  let mn = Math.min.apply(null,ys), mx = Math.max.apply(null,ys);
  if(mn===mx){ mn = mn - Math.max(1, mn*0.08); mx = mx + Math.max(1, mx*0.08); }
  const pad=(mx-mn)*0.16; mn-=pad; mx+=pad;
  const X = i => pl + (pts.length<2 ? 0 : (i/(pts.length-1))*(W-pl-pr));
  const Y = v => pt + (1-(v-mn)/(mx-mn))*(Ht-pt-pb);
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+Ht+'">';
  [0,0.5,1].forEach(function(t){
    const y = pt+t*(Ht-pt-pb), v = mx-t*(mx-mn);
    s += '<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#DDE2E7" stroke-width="1"/>'+
      '<text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="#5B6672" font-family="Barlow">'+f(Math.round(v*10)/10)+'</text>';
  });
  const d = pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.y)).join(' ');
  s += '<path d="'+d+' L'+X(pts.length-1)+' '+(Ht-pb)+' L'+X(0)+' '+(Ht-pb)+' Z" fill="#B8720E" opacity=".10"/>';
  s += '<path d="'+d+'" fill="none" stroke="#B8720E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    s += '<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3.6" fill="#FFFFFF" stroke="#B8720E" stroke-width="2.2"/>';
    if(pts.length<=8) s += '<text x="'+X(i)+'" y="'+(Y(p.y)-9)+'" text-anchor="middle" font-size="9.5" fill="#5B6672" font-family="Barlow">×'+f(p.r)+'</text>';
  });
  s += '<text x="'+X(0)+'" y="'+(Ht-5)+'" font-size="9.5" fill="#5B6672" font-family="Barlow">'+courte(pts[0].d)+'</text>';
  if(pts.length>1) s += '<text x="'+(W-pr)+'" y="'+(Ht-5)+'" text-anchor="end" font-size="9.5" fill="#5B6672" font-family="Barlow">'+courte(pts[pts.length-1].d)+'</text>';
  return s+'</svg>';
}

/* ── CSV : conversion et lecture ─────────────────────────── */
function csvEchappe(v){
  v = (v===null||v===undefined) ? '' : String(v);
  if(/[;"\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function versCSV(){
  const rows = [['Date','Exercice','Groupe','Séries','Répétitions','Charge','Unité','Matériel']];
  datesTriees().slice().reverse().forEach(function(d){
    S.jours[d].forEach(function(x){
      const e = exo(x.exId); if(!e || !x.lignes) return;
      x.lignes.forEach(function(li){
        rows.push([d, e.nom, (GROUPES[e.g]?GROUPES[e.g].nom:e.g), li.series, li.reps, li.charge, e.unite, (li.materiel?MATLABEL[li.materiel]:'')]);
      });
    });
  });
  return rows.map(r=>r.map(csvEchappe).join(';')).join('\r\n');
}
function depuisCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const lignes = text.split(/\r\n|\n|\r/).filter(l=>l.length);
  return lignes.map(function(line){
    const cells = []; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(inQ){
        if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=c;
      } else {
        if(c==='"') inQ=true;
        else if(c===';' || c===','){ cells.push(cur); cur=''; }
        else cur+=c;
      }
    }
    cells.push(cur);
    return cells;
  });
}
function importerLignesCSV(rows){
  if(!rows.length) return {importees:0, ignorees:0, erreur:'vide'};
  const entete = rows[0].map(h=>h.trim().toLowerCase());
  const iDate = entete.indexOf('date'), iNom = entete.indexOf('exercice'),
        iSeries = entete.indexOf('séries'), iReps = entete.indexOf('répétitions'),
        iCharge = entete.indexOf('charge'), iMat = entete.indexOf('matériel');
  if(iDate<0 || iNom<0) return {importees:0, ignorees:rows.length-1, erreur:'entetes'};
  const matInverse = {}; Object.keys(MATLABEL).forEach(k=>matInverse[MATLABEL[k].toLowerCase()]=k);
  let importees=0, ignorees=0;
  for(let i=1;i<rows.length;i++){
    const r = rows[i]; if(!r || r.length<2){ continue; }
    const date = (r[iDate]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ ignorees++; continue; }
    const nom = (r[iNom]||'').trim();
    const ex = tous().find(e=>e.nom.toLowerCase()===nom.toLowerCase());
    if(!ex){ ignorees++; continue; }
    const series = iSeries>=0 ? (parseFloat(String(r[iSeries]).replace(',','.'))||0) : 0;
    const reps = iReps>=0 ? (parseFloat(String(r[iReps]).replace(',','.'))||0) : 0;
    const charge = iCharge>=0 ? (parseFloat(String(r[iCharge]).replace(',','.'))||0) : 0;
    const matTxt = iMat>=0 ? (r[iMat]||'').trim().toLowerCase() : '';
    const materiel = matTxt ? (matInverse[matTxt]||null) : null;
    const jour = ligneJour(date);
    let entry = jour.find(x=>x.exId===ex.id);
    if(!entry){ entry = {exId:ex.id, lignes:[]}; jour.push(entry); }
    entry.lignes.push({series:series, reps:reps, charge:charge, materiel:materiel});
    importees++;
  }
  return {importees:importees, ignorees:ignorees};
}

/* ═══════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════ */
function ajouter(id){
  const e = exo(id); if(!e) return;
  const l = ligneJour(UI.date);
  if(l.some(x=>x.exId===id)){ UI.vue='jour'; fermer(); render(); return; }
  const p = derniere(id, UI.date);
  const depart = p ? Object.assign({}, p.ligne) :
    {series:3, reps:(e.type==='carry'?30:5), charge:e.charge, materiel:(e.materiels?e.materiels[0]:null)};
  l.push({exId:id, lignes:[Object.assign({}, depart)]});
  UI.saisie[id] = Object.assign({}, depart);
  sauver(); buzz(10); UI.vue='jour'; fermer(); render(); toast(e.nom+' ajouté');
}

document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-action],[data-tab]');
  if(!el) return;
  if(el.dataset.tab){ UI.vue = el.dataset.tab; fermer(); render(); return; }
  const a = el.dataset.action, id = el.dataset.id;

  switch(a){
    case 'fermer': fermer(); break;
    case 'aller': UI.vue = id; render(); break;
    case 'reglages': sheetReglages(); break;
    case 'filtre': UI.filtre = id; render(); break;
    case 'fiche': sheetFiche(id); break;
    case 'ajouter': ajouter(id); break;
    case 'ajouter-sheet': sheetPicker(); break;

    case 'pas': {
      const s = UI.saisie[id]; if(!s) break;
      const inp = el.parentElement.querySelector('input');
      const pas = parseFloat(inp.dataset.pas) || 1;
      let v = (parseFloat(String(inp.value).replace(',','.')) || 0) + (+el.dataset.d)*pas;
      v = Math.max(0, Math.round(v*100)/100);
      inp.value = f(v); s[el.dataset.k] = v; buzz(4);
      break; }

    case 'materiel': {
      const s = UI.saisie[id]; if(!s) break;
      s.materiel = el.dataset.m; UI._y = document.getElementById('scrollarea').scrollTop; render();
      break; }

    case 'ajouter-ligne': {
      const entry = ligneJour(UI.date).find(x=>x.exId===id); if(!entry) break;
      const s = UI.saisie[id]; if(!s) break;
      if((+s.series||0)<=0 || (+s.reps||0)<=0){ toast('Séries et reps doivent être supérieures à 0'); break; }
      entry.lignes.push(Object.assign({}, s));
      sauver(); buzz(12); UI._y = document.getElementById('scrollarea').scrollTop; render(); toast('Charge ajoutée');
      break; }

    case 'suppr-ligne': {
      const arr = ligneJour(UI.date);
      const entry = arr.find(x=>x.exId===id); if(!entry) break;
      entry.lignes.splice(+el.dataset.li, 1);
      if(!entry.lignes.length){ const idx = arr.indexOf(entry); if(idx>=0) arr.splice(idx,1); delete UI.saisie[id]; }
      sauver(); UI._y = document.getElementById('scrollarea').scrollTop; render(); break; }

    case 'retirer-exo': {
      const arr = ligneJour(UI.date);
      const idx = arr.findIndex(x=>x.exId===id);
      if(idx>=0) arr.splice(idx,1);
      delete UI.saisie[id];
      sauver(); UI._y = document.getElementById('scrollarea').scrollTop; render(); break; }

    case 'toggle': UI.ouvert[id] = !UI.ouvert[id]; UI._y = document.getElementById('scrollarea').scrollTop; render(); break;
    case 'suppr-jour':
      if(confirm('Supprimer la séance du '+longue(id)+' ?')){ delete S.jours[id]; sauver(); render(); }
      break;
    case 'reprendre': {
      const src = S.jours[id].slice();
      UI.date = iso(new Date()); UI.saisie = {};
      const l = ligneJour(UI.date);
      src.forEach(function(x){
        if(!l.some(y=>y.exId===x.exId)) l.push({exId:x.exId, lignes:x.lignes.map(li=>Object.assign({},li))});
      });
      sauver(); UI.vue='jour'; render(); toast('Séance reprise pour aujourd’hui');
      break; }

    case 'ex-charge': UI.exCharge = id; render(); break;

    case 'nouvel-exo': sheetNouvel(); break;
    case 'creer': {
      const g = i => { const n = document.getElementById(i); return n ? n.value : ''; };
      const nom = g('nx-nom').trim(); if(!nom){ toast('Il manque le nom'); break; }
      const type = g('nx-type');
      const mats = [];
      ['haltere','disque','kettlebell'].forEach(function(m){
        const cb = document.getElementById('nx-mat-'+m); if(cb && cb.checked) mats.push(m);
      });
      const e = {id:'p'+Date.now().toString(36), perso:true, pic: type==='carry' ? 'farmer' : 'military',
        g: g('nx-g'), nom: nom, type: type, unite: g('nx-unite').trim() || 'kg',
        charge: parseFloat(g('nx-charge').replace(',','.')) || 20, pas: 2.5,
        cible: g('nx-cible').trim() || '3 × 5–8', muscles: g('nx-mus').trim() || '—', tech: [], note: ''};
      if(mats.length) e.materiels = mats;
      S.perso.push(e); sauver(); fermer(); UI.vue='exos'; UI.filtre = e.g; render(); toast(nom+' créé');
      break; }
    case 'suppr-exo':
      if(confirm('Supprimer ce mouvement ? Les séances déjà saisies le conservent.')){
        S.perso = S.perso.filter(x=>x.id!==id); sauver(); fermer(); render();
      } break;

    case 'export': {
      const b = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
      const u = URL.createObjectURL(b), a2 = document.createElement('a');
      a2.href = u; a2.download = 'carnet-de-fonte-'+iso(new Date())+'.json';
      document.body.appendChild(a2); a2.click(); a2.remove(); URL.revokeObjectURL(u);
      toast('Sauvegarde enregistrée'); break; }
    case 'import': document.getElementById('fimport').click(); break;
    case 'export-csv': {
      const b = new Blob(['\uFEFF'+versCSV()], {type:'text/csv;charset=utf-8'});
      const u = URL.createObjectURL(b), a2 = document.createElement('a');
      a2.href = u; a2.download = 'carnet-de-fonte-'+iso(new Date())+'.csv';
      document.body.appendChild(a2); a2.click(); a2.remove(); URL.revokeObjectURL(u);
      toast('CSV exporté'); break; }
    case 'import-csv': document.getElementById('fimportcsv').click(); break;
    case 'reset':
      if(confirm('Effacer toutes les séances et tous les mouvements créés ?')){
        S = {jours:{}, perso:[]}; sauver(); fermer(); render(); toast('Carnet remis à zéro');
      } break;
  }
});

document.addEventListener('input', function(ev){
  const t = ev.target;
  if(t.dataset && t.dataset.action==='saisie'){
    const s = UI.saisie[t.dataset.id]; if(!s) return;
    const v = parseFloat(String(t.value).replace(',','.'));
    s[t.dataset.k] = isNaN(v) ? 0 : Math.max(0, v);
  }
});

document.addEventListener('change', function(ev){
  const t = ev.target;
  if(t.dataset && t.dataset.action==='date'){ UI.date = t.value || iso(new Date()); UI.saisie = {}; render(); }
  if(t.id==='fimport'){
    const file = t.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = function(){
      try{
        const d = JSON.parse(r.result);
        if(!d || !d.jours) throw 0;
        S = Object.assign({jours:{}, perso:[]}, d);
        sauver(); fermer(); render(); toast('Sauvegarde restaurée');
      }catch(e){ toast('Fichier illisible'); }
    };
    r.readAsText(file);
  }
  if(t.id==='fimportcsv'){
    const file = t.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = function(){
      const res = importerLignesCSV(depuisCSV(r.result));
      if(res.erreur==='vide'){ toast('Fichier vide'); return; }
      if(res.erreur==='entetes'){ toast('Colonnes Date/Exercice introuvables'); return; }
      sauver(); fermer(); render();
      toast(res.importees+' ligne'+(res.importees>1?'s':'')+' importée'+(res.importees>1?'s':'')+(res.ignorees?', '+res.ignorees+' ignorée'+(res.ignorees>1?'s':''):''));
    };
    r.readAsText(file);
  }
});

/* ═══════════════════════════════════════════════════════════ */
(async function(){
  app.innerHTML = '<div class="empty"><div class="big">Carnet de fonte</div><p class="muted">Ouverture…</p></div>';
  await charger();
  UI.date = iso(new Date());
  const ds = datesTriees();
  if(ds.length) UI.ouvert[ds[0]] = true;
  render();
})();

window.addEventListener('beforeunload', function(){
  if(window.storage) try{ window.storage.set(KEY, JSON.stringify(S)); }catch(e){}
});
</script>
